name: EVEmu Build and Release

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, evemu-crucible-modernization]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  linux:
    name: Linux GCC build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build zlib1g-dev libmariadb-dev libboost-all-dev libtinyxml-dev libutfcpp-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=\${{ env.BUILD_TYPE }} -DCMAKE_INSTALL_PREFIX=stage
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install
        run: cmake --install build --prefix stage
      - name: Add runtime files and package
        run: |
          mkdir -p stage/share/evemu
          cp -a sql stage/share/evemu/
          cp -a utils stage/share/evemu/
          cp -a config stage/share/evemu/ 2>/dev/null || true
          printf 'Commit: %s\nBranch: %s\nPlatform: Linux x86_64\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > stage/BUILD-INFO.txt
          tar -czf evemu-crucible-linux-x86_64.tar.gz -C stage .
          sha256sum evemu-crucible-linux-x86_64.tar.gz > evemu-crucible-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: evemu-crucible-linux-x86_64
          path: |
            evemu-crucible-linux-x86_64.tar.gz
            evemu-crucible-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows 64-bit UCRT64 GCC build
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libmariadbclient
            mingw-w64-ucrt-x86_64-tinyxml
            mingw-w64-ucrt-x86_64-utf8cpp
            mingw-w64-ucrt-x86_64-zlib
      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=stage
      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel 2
      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
      - name: Install
        shell: msys2 {0}
        run: cmake --install build --prefix stage
      - name: Package Windows build and MinGW runtime DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage\share\evemu | Out-Null
          Copy-Item sql -Destination stage\share\evemu\sql -Recurse
          Copy-Item utils -Destination stage\share\evemu\utils -Recurse
          if (Test-Path config) { Copy-Item config -Destination stage\share\evemu\config -Recurse }
          ("Commit: " + $env:GITHUB_SHA + [Environment]::NewLine + "Branch: " + $env:GITHUB_REF_NAME + [Environment]::NewLine + "Platform: Windows x86_64 UCRT64") | Set-Content stage\BUILD-INFO.txt
          $objdumpCommand = Get-Command objdump.exe -ErrorAction Stop
          $objdump = $objdumpCommand.Source
          $dllSource = Split-Path -Parent $objdump
          $seen = @{}
          $queue = @(Get-ChildItem stage -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.dll') })
          while ($queue.Count -gt 0) {
            $current = $queue
            $queue = @()
            foreach ($binary in $current) {
              $imports = & $objdump -p $binary.FullName 2>$null | Select-String 'DLL Name:' | ForEach-Object { ($_ -split 'DLL Name:')[1].Trim() }
              foreach ($name in $imports) {
                if (-not $seen.ContainsKey($name)) {
                  $seen[$name] = $true
                  $candidate = Join-Path $dllSource $name
                  if (Test-Path $candidate) {
                    $destination = Join-Path (Resolve-Path stage).Path $name
                    Copy-Item $candidate $destination -Force
                    if ([IO.Path]::GetExtension($name) -ieq '.dll') { $queue += Get-Item $destination }
                  }
                }
              }
            }
          }
          Compress-Archive -Path stage\* -DestinationPath evemu-crucible-windows-x86_64.zip -Force
          $hash = (Get-FileHash evemu-crucible-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  evemu-crucible-windows-x86_64.zip" | Set-Content evemu-crucible-windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: evemu-crucible-windows-x86_64
          path: |
            evemu-crucible-windows-x86_64.zip
            evemu-crucible-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker image build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --pull -t evemu-crucible:ci .

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, docker]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: evemu-crucible-linux-x86_64
          path: dist
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: evemu-crucible-windows-x86_64
          path: dist
      - name: Publish release with both platforms and checksums
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/evemu-crucible-linux-x86_64.tar.gz
            dist/evemu-crucible-linux-x86_64.tar.gz.sha256
            dist/evemu-crucible-windows-x86_64.zip
            dist/evemu-crucible-windows-x86_64.zip.sha256
